# Vicinity DAG Configuration
#
# Layout:
#   defaults       — inherited by every task unless overridden
#   notifications  — Slack webhook config
#   master         — orchestration schedule, gates, pools
#   dags.<name>    — per-pipeline config
#
# Convention:
#   schedule: null   → master-managed, no independent schedule
#   schedule: "cron" → independent, excluded from master orchestration
#   phase: 1|2|3    → execution order within master DAG
#   required: true   → gate fails if this task fails

defaults:
  owner: "vicinity"
  retries: 2
  retry_delay_min: 5
  max_active_runs: 1
  dagrun_timeout_min: 120
  start_date: "2026-04-11"
  catchup: false
  tags: ["vicinity"]

notifications:
  slack:
    enabled: true
    conn_id: "slack_vicinity"
    channel: "#vicinity-alerts"
    notify_on_success: true
    mention_on_failure: "<!channel>"
    mention_on_retry: ""

master:
  description: "Vicinity master pipeline — ingest, sync, score"
  schedule: "0 6 * * *"
  dagrun_timeout_min: 150
  sla_min: 120
  tags: ["vicinity", "master"]
  gates:
    min_ingest_success: 5
    listings_required: true
  pools:
    scraping: 2    # Playwright instances — memory-bound
    api: 4         # HTTP API calls
    compute: 2     # Snowflake-heavy tasks

dags:

  # ── Phase 1: Ingest ────────────────────────────────────────

  ingest_crime:
    phase: 1
    command: "app.pipelines.ingest_crime"
    pool: api
    required: false
    description: "Boston PD crime incidents (CKAN)"
    schedule: null
    retries: 3
    retry_delay_min: 10
    dagrun_timeout_min: 90
    sla_min: 60
    tags: ["vicinity", "ingest", "safety"]
    pipeline_flags:
      mode: "incremental"
      limit: null
      start_date: null
      end_date: null
      dry_run: false

  ingest_311:
    phase: 1
    command: "app.pipelines.ingest_311"
    pool: api
    required: false
    description: "Boston 311 complaints (CKAN)"
    schedule: null
    retries: 3
    retry_delay_min: 10
    dagrun_timeout_min: 120
    sla_min: 90
    tags: ["vicinity", "ingest", "livability"]
    pipeline_flags:
      mode: "incremental"
      limit: null
      start_date: null
      end_date: null
      dry_run: false

  ingest_citizen:
    phase: 1
    command: "app.pipelines.ingest_citizen"
    pool: api
    required: false
    description: "Citizen App real-time incidents"
    schedule: null
    retries: 2
    retry_delay_min: 3
    dagrun_timeout_min: 15
    sla_min: 10
    tags: ["vicinity", "ingest", "safety"]
    pipeline_flags:
      mode: "full"
      limit: null
      dry_run: false

  ingest_listings:
    phase: 1
    command: "app.pipelines.ingest_listings"
    pool: api
    required: true
    description: "HomeHarvest MLS listings"
    schedule: null
    retries: 2
    retry_delay_min: 10
    dagrun_timeout_min: 60
    sla_min: 45
    tags: ["vicinity", "ingest", "listings"]
    pipeline_flags:
      mode: "incremental"
      limit: null
      start_date: null
      end_date: null
      dry_run: false
      location: null
      past_days: null
      min_price: null
      max_price: null
      skip_deactivation: false

  ingest_listings_craigslist:
    phase: 1
    command: "app.pipelines.ingest_listings_craigslist"
    pool: scraping
    required: false
    description: "Craigslist fallback listings"
    schedule: null
    retries: 2
    retry_delay_min: 15
    dagrun_timeout_min: 90
    sla_min: 60
    tags: ["vicinity", "ingest", "listings", "scraping"]
    pipeline_flags:
      mode: "full"
      limit: 200
      dry_run: false
      min_price: null
      max_price: null
      delay: null
      no_headless: false

  ingest_eventbrite:
    phase: 1
    command: "app.pipelines.ingest_eventbrite"
    pool: scraping
    required: false
    description: "Eventbrite lifestyle events"
    schedule: null
    retries: 2
    retry_delay_min: 10
    dagrun_timeout_min: 30
    sla_min: 20
    tags: ["vicinity", "ingest", "lifestyle"]
    pipeline_flags:
      preference_tag: null
      query: null
      pages: 1
      dry_run: false

  ingest_reddit:
    phase: 1
    command: "app.pipelines.ingest_reddit"
    pool: api
    required: false
    description: "Reddit neighbourhood signals"
    schedule: null
    retries: 2
    retry_delay_min: 10
    dagrun_timeout_min: 60
    sla_min: 45
    tags: ["vicinity", "ingest", "lifestyle"]
    pipeline_flags:
      preference_tag: null
      query: null
      subreddit: null
      dry_run: false

  ingest_google_news:
    phase: 1
    command: "app.pipelines.ingest_google_news"
    pool: scraping
    required: false
    description: "Google News neighbourhood signals"
    schedule: null
    retries: 2
    retry_delay_min: 10
    dagrun_timeout_min: 90
    sla_min: 60
    tags: ["vicinity", "ingest", "lifestyle"]
    pipeline_flags:
      preference_tag: null
      query: null
      dry_run: false

  # ── Phase 2: Sync ──────────────────────────────────────────

  sync_pinecone:
    phase: 2
    command: "app.pipelines.sync_pinecone"
    pool: compute
    required: false
    description: "Embed and upsert lifestyle signals to Pinecone"
    schedule: null
    retries: 2
    retry_delay_min: 10
    dagrun_timeout_min: 60
    sla_min: 45
    tags: ["vicinity", "sync", "pinecone"]
    pipeline_flags:
      preference_tag: null
      batch_size: null
      force_reembed: false
      gc: false
      dry_run: false

  # ── Phase 3: Score ─────────────────────────────────────────

  score_listings:
    phase: 3
    command: "app.scoring.pipeline"
    pool: compute
    required: false
    description: "Compute location scores for all active listings"
    schedule: null
    retries: 1
    retry_delay_min: 5
    dagrun_timeout_min: 60
    sla_min: 45
    tags: ["vicinity", "scoring"]
    pipeline_flags:
      mode: "incremental"
      dry_run: false

  # ── Independent (own schedule, excluded from master) ───────

  ingest_transit:
    command: "app.pipelines.ingest_transit"
    pool: api
    description: "MBTA transit stops and routes"
    schedule: "0 3 1 * *"
    retries: 3
    retry_delay_min: 5
    dagrun_timeout_min: 30
    sla_min: 20
    tags: ["vicinity", "ingest", "seed"]
    pipeline_flags:
      mode: "full"
      dry_run: false
      route_types: null

  ingest_amenities:
    command: "app.pipelines.ingest_amenities"
    pool: api
    description: "Overpass OSM amenities"
    schedule: "0 4 1 * *"
    retries: 3
    retry_delay_min: 20
    dagrun_timeout_min: 60
    sla_min: 45
    tags: ["vicinity", "ingest", "seed"]
    pipeline_flags:
      mode: "full"
      dry_run: false
      categories: null