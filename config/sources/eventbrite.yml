source: "eventbrite"
target_table: "RAW.LIFESTYLE_SIGNALS"

connection:
  base_url: "https://www.eventbrite.com/d"
  timeout: 30

center:
  lat: 42.3534
  lon: -71.1323

location:
  slug: "ma--boston"
  max_radius_km: 15

# ── Queries ──────────────────────────────────────────────────
# Tag → list of Eventbrite search slugs. Organizer Agent may write here.
queries:
  live_music:
    - "live-music"
    - "concerts"
  korean_food:
    - "korean-food"
  yoga:
    - "yoga"
  dining:
    - "food-and-drink"
  fitness:
    - "fitness"
    - "health"


  # -- Added by Organizer (2026-04-23 07:59 UTC) --
  party_culture_mit:
    - "mit-party"
    - "cambridge-nightlife"
    - "kendall-square-events"
    - "college-party-boston"

# Tags treated as livability signals.
# All other tags are lifestyle. Eventbrite is almost entirely lifestyle.
livability_tags: []

rate_limit:
  delay_between_requests: 1.0
  backoff_base: 2.0
  backoff_max: 30.0
  max_attempts: 3

schedule: "daily"