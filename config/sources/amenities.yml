source: "amenities"
target_table: "RAW.AMENITIES"

connection:
  base_url: "https://overpass-api.de/api/interpreter"
  timeout: 60

# Boston metro bbox from spatial.yml — covers Boston, Cambridge,
# Somerville, Brookline, Watertown, Medford, Everett, etc.
bbox:
  south: 42.2
  west: -71.3
  north: 42.5
  east: -70.9

# Each entry becomes one Overpass QL query.
# key = OSM tag key (stored as category), value = OSM tag value (stored as subcategory).
# Queries are batched by key at runtime — all "amenity" values become one regex query.
queries:
  # Groceries & essentials
  - key: "shop"
    value: "supermarket"
  - key: "shop"
    value: "convenience"
  - key: "shop"
    value: "grocery"
  - key: "shop"
    value: "laundry"

  # Food & drink
  - key: "amenity"
    value: "cafe"
  - key: "amenity"
    value: "restaurant"
  - key: "amenity"
    value: "fast_food"
  - key: "amenity"
    value: "bar"
  - key: "amenity"
    value: "pub"
  - key: "amenity"
    value: "nightclub"

  # Health
  - key: "amenity"
    value: "pharmacy"
  - key: "amenity"
    value: "hospital"
  - key: "amenity"
    value: "clinic"
  - key: "amenity"
    value: "doctors"
  - key: "amenity"
    value: "dentist"

  # Education & childcare
  - key: "amenity"
    value: "school"
  - key: "amenity"
    value: "kindergarten"
  - key: "amenity"
    value: "childcare"
  - key: "amenity"
    value: "library"

  # Services
  - key: "amenity"
    value: "bank"
  - key: "amenity"
    value: "atm"
  - key: "amenity"
    value: "post_office"
  - key: "amenity"
    value: "place_of_worship"
  - key: "amenity"
    value: "community_centre"

  # Safety
  - key: "amenity"
    value: "police"
  - key: "amenity"
    value: "fire_station"

  # Entertainment
  - key: "amenity"
    value: "cinema"
  - key: "amenity"
    value: "theatre"

  # Fitness & recreation
  - key: "leisure"
    value: "fitness_centre"
  - key: "leisure"
    value: "park"
  - key: "leisure"
    value: "playground"
  - key: "leisure"
    value: "dog_park"
  - key: "leisure"
    value: "sports_centre"
  - key: "leisure"
    value: "swimming_pool"
  - key: "leisure"
    value: "garden"

freshness_days: 30

rate_limit:
  delay_between_queries: 15.0
  max_attempts: 3

schedule: "monthly"

classification:
  enabled: false